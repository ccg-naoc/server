<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户文档</title>
    <style>
      :root { --bg: #f6f7f9; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --link: #2563eb; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif; line-height: 1.7; }
      main { max-width: 720px; margin: 0 auto; padding: 48px 18px 80px; }
      .card { border: 1px solid var(--border); border-radius: 14px; padding: 18px; background: var(--card); box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08); }
      label { display: block; margin-bottom: 6px; }
      input[type="password"] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
      button { margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: #f1f5f9; color: var(--text); cursor: pointer; }
      .err { margin-top: 10px; color: #b91c1c; }
      .muted { color: var(--muted); font-size: 14px; }
      #unlock { display: none; }
      #loading { display: block; }
      .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--link); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div id="loading" class="card">
        <div style="display:flex; gap:10px; align-items:center;">
          <div class="spinner" aria-hidden="true"></div>
          <div>
            <div style="font-weight:700;">正在打开</div>
            <div class="muted">如果当前浏览器已保存密码，会自动解密。</div>
          </div>
        </div>
      </div>
      <div id="unlock" class="card">
        <h1 style="margin: 0 0 12px;">请输入密码</h1>
        <div class="muted">该页面内容已加密，只有输入正确密码才能查看。</div>
        <div style="height: 14px;"></div>
        <label for="pwd">密码</label>
        <input id="pwd" type="password" autocomplete="current-password" />
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="btn" type="button">解密并打开</button>
          <button id="logout" type="button">清除密码</button>
        </div>
        <div id="err" class="err" role="alert" aria-live="polite"></div>
      </div>
    </main>

      function loadCachedPassword() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        try {
          const cached = JSON.parse(raw);
          if (!cached || typeof cached.password !== "string" || typeof cached.expiresAt !== "number") {
            clearCachedPassword();
            return null;
          }
          if (Date.now() >= cached.expiresAt) {
            clearCachedPassword();
            return null;
          }
          return cached.password;
        } catch (e) {
          clearCachedPassword();
          return null;
        }
      }
      async function deriveKey(password, salt, iterations) {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt, iterations },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }
      async function decryptAndOpen(pwd) {
        const err = document.getElementById("err");
        err.textContent = "";
        if (!pwd) { err.textContent = "请输入密码。"; return; }
        try {
          const salt = dec(meta.saltB64);
          const iv = dec(meta.ivB64);
          const payload = dec(meta.payloadB64);
          const key = await deriveKey(pwd, salt, meta.iterations);
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, payload);
          const html = new TextDecoder().decode(new Uint8Array(plain));
          saveCachedPassword(pwd);
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          clearCachedPassword();
          document.getElementById("loading").style.display = "none";
          document.getElementById("unlock").style.display = "block";
          err.textContent = "密码错误，或文件已损坏。";
        }
      }
      function logout() {
        clearCachedPassword();
        location.reload();
      }
      document.getElementById("logout").addEventListener("click", logout);
      document.getElementById("btn").addEventListener("click", () => decryptAndOpen(document.getElementById("pwd").value));
      document.getElementById("pwd").addEventListener("keydown", (e) => {
        if (e.key === "Enter") decryptAndOpen(document.getElementById("pwd").value);
      });
      function showUnlock() {
        document.getElementById("loading").style.display = "none";
        document.getElementById("unlock").style.display = "block";
        document.getElementById("pwd").focus();
      }
      const cached = loadCachedPassword();
      if (cached) decryptAndOpen(cached);
      else showUnlock();
    </script>
  </body>
</html>
